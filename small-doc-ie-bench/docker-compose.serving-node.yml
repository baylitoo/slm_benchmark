# A REMOTE serving node: one container, nothing else (milestone #4, #538).
#
# The central stack (docker-compose.yml) keeps Postgres, Inngest, Redis, the
# api, the web UI and the scaled `worker`. A serving node adds capacity and
# runs ONLY the serving role: deploy/seed/delete lifecycle, the reconciler, and
# the llama-server / encoder runtimes those deploys launch.
#
#   docker compose -f docker-compose.serving-node.yml up -d
#
# Check the node BEFORE it takes traffic, and again after editing its .env:
#
#   docker compose -f docker-compose.serving-node.yml run --rm serving \
#     docie-serving doctor --probe-ports
#
# It exits non-zero on a configuration that cannot work, and warns about the
# ones that otherwise present as a wrong answer rather than an error -- an
# advertise host that resolves to another machine, a duplicate node id, a
# port window something else is holding. See docs/operations/fleet-runbook.md.
#
# The node reads one `.env`, same as the central stack. Copy the central `.env`
# so every application setting matches, then append the node block from
# `.env.serving-node.example` and correct the values it marks.
#
# Four of them have NO default and the stack refuses to start without them,
# because every one silently misroutes or over-exposes if guessed:
#
#   DOCIE_DB_HOST                    central Postgres, reachable from here
#   DOCIE_SERVING_ADVERTISE_HOST     THIS node's address as the central api sees it
#   DOCIE_SERVING_PUBLISH_IP         the interface the runtime ports bind on
#   POSTGRES_PASSWORD                same as the central stack
#
# Everything the serving role reads from Postgres (the model catalog, observed
# placements) and from Inngest (lifecycle events) travels over the network, so
# this file mounts no shared storage: `data`, `runs`, `annotations` and
# `artifact-store` are benchmark/worker surfaces the serving role never writes.

services:
  serving:
    # Prefer a published image: this build compiles llama.cpp and installs the
    # encoder + embedding extras, which is a long build to repeat on every
    # machine in the fleet. Point DOCIE_SERVING_IMAGE at a registry tag to skip
    # it; the build stanza stays as the local fallback.
    image: ${DOCIE_SERVING_IMAGE:-docie-serving:local}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      args:
        # Must match the central `serving` service: encoder deployments spawn
        # INSIDE this container and need the analyzer library.
        PIP_EXTRAS: "ocr,encoders"
        INSTALL_EMBEDDINGS: "true"
        LLAMA_REF: ${LLAMA_REF:-}
    env_file: .env
    mem_limit: ${DOCIE_SERVING_MEM_LIMIT:-8g}
    environment:
      # Central Postgres over the private network. Only the HOST differs from
      # the central stack's own value -- user, port and database name are the
      # same, and the password must be identical.
      DATABASE_URL: postgresql+psycopg://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your node .env (the SAME value as the central stack)}@${DOCIE_DB_HOST:?set DOCIE_DB_HOST to the central Postgres address reachable from this node (not "postgres", which only resolves inside the central compose network)}:${DOCIE_DB_PORT:-5432}/docie

      # Lifecycle + reconciler only. Extraction and benchmark functions stay on
      # the central `worker`; this node registers the serving app alone.
      DOCIE_WORKER_ROLE: serving

      # Node-local state: desired state (deployments.json), this node's id and
      # the applied-state file. NEVER share this volume between machines --
      # two nodes would fight over one deployments.json and adopt each other's
      # identity.
      DOCIE_SERVING_HOME: /app/.serving

      # Where model weights are kept. Unset (the default) means
      # $DOCIE_SERVING_HOME/models, where they have always lived -- a CHILD of
      # the state volume, so nothing moves and nothing breaks on upgrade.
      #
      # What the default costs is placement, not safety: removing the models
      # directory does not touch node_id beside it, but the weights share one
      # VOLUME with the durable state, so they cannot live on a different
      # disk, their growth consumes that volume, and destroying or resizing it
      # takes both.
      #
      # Setting this requires the model-cache mount below AND moving the
      # existing weights. A root that is or contains $DOCIE_SERVING_HOME is
      # refused at startup: a disposable cache must not hold node identity.
      DOCIE_MODEL_STORE_DIR: ${DOCIE_MODEL_STORE_DIR:-}

      # Optional readable name for this node; generated and persisted in
      # DOCIE_SERVING_HOME when unset. Must be unique across the fleet.
      DOCIE_SERVING_NODE_ID: ${DOCIE_SERVING_NODE_ID:-}

      # THE value to get right. Every deploy records its endpoint as
      # http://{this}:{port}/v1, and the central api resolves that string in
      # ITS network -- so a compose service name like `serving` resolves there
      # to the central node's own container, and requests for this node's
      # models land on the wrong machine (#538). No default: a wrong value here
      # fails as a wrong answer, not as an error.
      DOCIE_SERVING_ADVERTISE_HOST: ${DOCIE_SERVING_ADVERTISE_HOST:?set DOCIE_SERVING_ADVERTISE_HOST to THIS node's address as the central api reaches it (e.g. its WireGuard IP) -- never a compose service name}

      # All interfaces INSIDE the container; what the host exposes is decided by
      # the `ports` binding below, not here.
      DOCIE_SERVING_BIND_HOST: 0.0.0.0

      # The window deploys allocate from. Published below as the same range, so
      # these two can never disagree -- a deploy landing on an unpublished port
      # would record an endpoint nothing can reach. Narrower than the code
      # default (8088-8188) because Docker runs one proxy per published port.
      # Nodes do NOT need disjoint windows: the recorded endpoint carries the
      # host, so each node may use the same ports on its own address.
      DOCIE_SERVING_PORT_RANGE_START: ${DOCIE_SERVING_PORT_RANGE_START:-8088}
      DOCIE_SERVING_PORT_RANGE_END: ${DOCIE_SERVING_PORT_RANGE_END:-8107}

      DOCIE_SERVING_RECONCILE_INTERVAL: ${DOCIE_SERVING_RECONCILE_INTERVAL:-10}

      # Converge on the desired state the central API writes for this node.
      # Defaulted ON here while the CODE default is off, and the difference is
      # deliberate: the code protects an EXISTING single-node stack from
      # acquiring, on upgrade, the one path that can stop a model nobody asked
      # it to stop. A node started from this file has no working set to lose
      # and exists to be managed centrally, so off would make it join the
      # fleet, report healthy, and then silently ignore every deploy aimed at
      # it, every auto-placed deploy that picks it, and the unload half of a
      # drain -- the node would leave the routing rotation but keep its memory.
      #
      # Safe on a fresh node: a node with no local deployments and no row in
      # the catalog converges on nothing (serving/convergence.py), so this
      # cannot act on another stack's rows if the database host is wrong.
      #
      # Set to 0 to bring a node up in observe-only mode: it publishes
      # capacity and serves, and logs the plans it would have carried out.
      DOCIE_SERVING_DESIRED_APPLY: ${DOCIE_SERVING_DESIRED_APPLY:-1}
    ports:
      # Bound to ONE explicit interface, not 0.0.0.0. A deployed runtime has no
      # authentication of its own -- the api gateway in front of it is what
      # carries the key -- so publishing these on a public interface would hand
      # anyone who can reach the host a free, unmetered inference endpoint.
      # Point DOCIE_SERVING_PUBLISH_IP at the private-network address the
      # central api uses, which is normally the same address as
      # DOCIE_SERVING_ADVERTISE_HOST.
      - "${DOCIE_SERVING_PUBLISH_IP:?set DOCIE_SERVING_PUBLISH_IP to this node's private-network address -- deployed runtimes are unauthenticated and must not be published on a public interface}:${DOCIE_SERVING_PORT_RANGE_START:-8088}-${DOCIE_SERVING_PORT_RANGE_END:-8107}:${DOCIE_SERVING_PORT_RANGE_START:-8088}-${DOCIE_SERVING_PORT_RANGE_END:-8107}"
    # No depends_on: Postgres and Inngest live on the central host. The
    # reconciler already tolerates a missing database (it skips the publish and
    # keeps repairing), and the Inngest Connect worker reconnects on its own, so
    # this node may boot before the central stack is reachable.
    restart: unless-stopped
    volumes:
      # A convenience, NOT a dependency: nothing the serving role runs reads
      # configs/. The nine serving functions (deploy/seed/delete/load/unload/
      # repair/reconfigure/pin) take their launch arguments from the family
      # contract in model_store.FAMILIES plus the store entry; the routing
      # table in configs/models.yaml is read by the central api and by the
      # worker role, neither of which runs here.
      #
      # Mounted so `docie-serving gateway`/`plan` work if you exec them in
      # here to debug. This copy going stale cannot affect what the node
      # serves, so do not go looking at it during an incident (#593).
      - ./configs:/app/configs:ro
      # Node-local. Not shareable: see DOCIE_SERVING_HOME above.
      - serving-state:/app/.serving
      # OPT-IN, and deliberately commented out: uncommenting this alone
      # does nothing, and uncommenting it together with
      # DOCIE_MODEL_STORE_DIR without migrating makes the node look like it
      # holds no models.
      #
      # The weights do not move by themselves. They stay in serving-state at
      # /app/.serving/models while the store looks in the new, empty volume,
      # so the node reports an empty blob store and re-seeds everything.
      # Copy them across first -- see "Moving the model cache to its own
      # volume" in docs/operations/fleet-runbook.md.
      #
      # - model-cache:/app/.cache/models
      - ocr-cache:/app/.cache/ocr
      - hf-cache:/root/.cache/huggingface
      # Optional: host Ollama blobs, so seed-from-ollama can import an existing
      # GGUF instead of re-downloading it on this machine.
      - ${OLLAMA_MODELS_HOST:-/root/.ollama/models}:/root/.ollama/models:ro
    command: ["docie-worker"]

volumes:
  serving-state:
  # Only used once the mount above is uncommented and DOCIE_MODEL_STORE_DIR
  # points at it. Declared so enabling the split is one edit, not two.
  model-cache:
  ocr-cache:
  hf-cache:

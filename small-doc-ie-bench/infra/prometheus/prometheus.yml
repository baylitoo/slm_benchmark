global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # One target per serving node, over its WireGuard address. Empty until an
  # operator adds infra/prometheus/targets/serving-nodes.yml (see the
  # .example beside it and docs/operations/fleet-runbook.md). Prometheus
  # re-reads the file on change, so adding a node needs no restart.
  - job_name: serving-nodes
    file_sd_configs:
      - files: ["/etc/prometheus/targets/serving-nodes*.yml"]

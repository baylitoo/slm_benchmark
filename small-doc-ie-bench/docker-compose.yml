name: small-doc-ie-bench

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      # Construct the container-network URL here instead of relying on a
      # DATABASE_URL value that itself references ${POSTGRES_PASSWORD} in an
      # env file. Deployment platforms such as Coolify may write that nested
      # reference literally or collapse it, leaving psycopg to fall back to a
      # nonexistent container-local Unix socket. `environment` overrides the
      # env_file value, so every Compose deployment gets the correct host.
      DATABASE_URL: postgresql+psycopg://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/docie
      # Pinned (not left to .env): every service MUST resolve the shared
      # serving state to the same mounted path. A missing .env line would
      # silently fall back to a container-local $HOME path — the volume then
      # mounts unused and the api reads an empty deployments.json forever.
      DOCIE_SERVING_HOME: /app/.serving
    depends_on:
      postgres:
        condition: service_healthy
      # Every mutation (deploy/seed/lifecycle/extract/benchmark) is an Inngest
      # event; without this dependency the api boots fine and then 503s every
      # write while the queue is still starting.
      inngest:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Writable (not :ro like the other services below): the profile-authoring
      # routes (studio_api.create_pipeline_profile/create_ocr_profile/
      # delete_pipeline_profile_route) splice configs/models.yaml in place via
      # tmp-file + os.replace — on a read-only mount that raises OSError
      # (Read-only file system) and the route 500s. Only the api container
      # writes this file; worker/serving/bench only read it, so they keep :ro.
      - ./configs:/app/configs
      - ./data:/app/data
      - ./runs:/app/runs
      - ./annotations:/app/annotations
      - ocr-cache:/app/.cache/ocr
      - serving-state:/app/.serving
      # Durable artifact store shared with the worker: the worker writes
      # report.html/predictions.jsonl here and the api serves them back by id,
      # so results are reachable regardless of which replica produced them.
      - artifact-store:/app/artifacts
    command: ["uvicorn", "docie_bench.api:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  # Self-hosted Inngest server: dashboard + event API (8288) and the Connect
  # WebSocket gateway (8289). Reuses the project Postgres (separate `inngest` DB,
  # created by infra/postgres/init.sql) and a dedicated Redis for run state.
  #
  # Step-budget contract (PR-4 review fix): this server's per-step execution /
  # Connect lease ceiling is NOT pinned here (the OSS binary exposes no
  # documented knob for it), so no worker-side step is allowed to DEPEND on
  # it. The worker awaits cold model loads in bounded ~60s chunks
  # (_AUTOLOAD_STEP_BUDGET_S, inngest/functions.py) even though the total
  # size-aware budget can reach 1800s, and the serving-side `load` step is
  # idempotent-convergent under the per-deployment load lock: an attempt
  # killed at any server limit leaves the load running in-process, and the
  # retry blocks on the lock then no-ops once the spawn completes (see
  # load_deployment_job). Raising server limits is an optimization, never a
  # correctness requirement.
  inngest:
    image: inngest/inngest
    command: ["inngest", "start"]
    # NOTE: do NOT use `env_file: .env` here. The Inngest *binary* reads many
    # INNGEST_* vars itself (e.g. INNGEST_PORT, INNGEST_DEV, INNGEST_BASE_URL),
    # so leaking the SDK/client env into the server makes it bind the wrong port
    # / wrong mode. Pass only what the server needs, explicitly.
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?set INNGEST_EVENT_KEY in .env}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?set INNGEST_SIGNING_KEY in .env}
      # Same docie user + POSTGRES_PASSWORD as the postgres service below —
      # only the password is parameterized (the username isn't the security
      # problem, and is also hardcoded in postgres's healthcheck/DATABASE_URL,
      # so making it overridable here alone would half-wire it).
      INNGEST_POSTGRES_URI: postgres://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/inngest
      INNGEST_REDIS_URI: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host ports only; the server always listens on 8288/8289 inside the
      # container. Use distinct var names so they can't collide with the
      # server's own INNGEST_PORT config.
      - "${INNGEST_HOST_PORT:-8288}:8288"
      - "${INNGEST_CONNECT_HOST_PORT:-8289}:8289"
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The serving control plane (PR-1, design doc §0.1/P1): a DEDICATED
  # SINGLE-REPLICA service that owns every runtime-process mutation — the
  # deploy/seed/delete Inngest functions plus the background reconciler. It is
  # the sole holder of the llama-server Popen handles and the sole writer of
  # deployments.json; scaling it would reintroduce the multi-writer clobber
  # and round-robin-advertise failure the split exists to prevent.
  #
  # NEVER run `--scale serving=N`. `deploy.replicas: 1` below is ADVISORY for
  # plain `docker compose` (it is only enforced by Swarm) and an explicit
  # `--scale serving=2` overrides it silently. Defense in depth: each replica
  # heartbeats a reconciler lease on the shared serving-state volume, and a
  # second replica that sees a live lease from another instance REFUSES to
  # start its reconciler (loud CRITICAL log). That guard contains the worst
  # damage (N reconcilers clobbering deployments.json) but a second replica
  # still registers duplicate lifecycle handlers — scale>1 stays forbidden.
  #
  # Inngest app: this service registers its OWN app id (docie-serving, see
  # INNGEST_SERVING_APP_ID) with only the lifecycle functions. Per the Inngest
  # Connect contract an app's function set is re-synced on every connect, so
  # serving and worker MUST NOT share one app id with disjoint function lists
  # (registrations would overwrite each other and flap).
  #
  # Reachability: the in-container runtime BINDS 0.0.0.0
  # (DOCIE_SERVING_BIND_HOST) and ADVERTISES this service's name
  # (DOCIE_SERVING_ADVERTISE_HOST=serving) in the DeploymentRecord, so sibling
  # containers reach it at `serving:<port>` over the compose network. A
  # single-replica service name always resolves to the one node that ran the
  # deploy — the deterministic-advertise guard in the control plane becomes
  # belt-and-suspenders. No published `ports:` — that would expose the unauth
  # runtime on 0.0.0.0.
  #
  # Memory (PR-2): the explicit mem_limit makes cgroup-v2 numbers
  # (memory.max/memory.current) the AUTHORITATIVE sizing denominator for the
  # resource tracker — without it memory.max reads the "max" sentinel and the
  # tracker degrades to the elastic Docker Desktop/WSL2 VM view (published
  # with source=vm and badged as soft). Size DOCIE_SERVING_MEM_LIMIT to the
  # RAM you actually grant the GGUF runtimes (weights + KV cache + ~0.5 GB
  # slab per deployment).
  #
  # The 8g DEFAULT is deliberately conservative: on Docker Desktop the WSL2 VM
  # defaults to 50% of host RAM (often 8g), and a mem_limit LARGER than the VM
  # never actually binds — the tracker would publish an authoritative-looking
  # cgroup ceiling the node cannot deliver, and runtimes sized to it get
  # VM-OOM-killed instead of fit-checked. Raise DOCIE_SERVING_MEM_LIMIT only
  # after granting the VM at least that much via %UserProfile%\.wslconfig
  # ([wsl2] memory=24GB, then `wsl --shutdown`).
  serving:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      args:
        # Encoder deployments (runtime: "encoder", e.g. the GLiNER PII guard)
        # spawn inside THIS container — it needs the analyzer library. Other
        # services keep the light "ocr" default.
        PIP_EXTRAS: "ocr,encoders"
        # llama.cpp pin: the serving container holds the llama-server that
        # actually serves deployed models. Set LLAMA_REF in .env to a commit/
        # tag to rebuild llama.cpp at that pin (reproducible + picks up new
        # arch support, e.g. Unlimited-OCR). Empty = latest HEAD (cached).
        LLAMA_REF: ${LLAMA_REF:-}
    env_file: .env
    mem_limit: ${DOCIE_SERVING_MEM_LIMIT:-8g}
    environment:
      DATABASE_URL: postgresql+psycopg://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/docie
      # Registers ONLY the lifecycle functions (deploy/seed/delete) under the
      # dedicated docie-serving Inngest app + runs the reconciler, so a
      # serving/* event can only land on this replica.
      DOCIE_WORKER_ROLE: serving
      # Pinned for the same reason as on `api`: one shared serving home.
      DOCIE_SERVING_HOME: /app/.serving
      # Deliberately NOT `${DOCIE_SERVING_ADVERTISE_HOST:-serving}`: a .env
      # written before the PR-1 service split carries
      # DOCIE_SERVING_ADVERTISE_HOST=worker, and interpolating the legacy
      # variable here would make every deploy advertise the SCALED worker
      # service name (round-robin endpoint — the exact failure the split
      # removed). The service pins its own name; to rename it, set the new
      # DOCIE_SERVING_ADVERTISE_HOST_OVERRIDE (the legacy variable is ignored
      # by this service and the worker warns at startup if it names a scaled
      # service).
      DOCIE_SERVING_ADVERTISE_HOST: ${DOCIE_SERVING_ADVERTISE_HOST_OVERRIDE:-serving}
      # Opt INTO an all-interfaces bind so sibling containers (api/worker) can
      # reach the runtime over the compose network. The code default is the
      # safe loopback 127.0.0.1 (so a local `docie up`/`docie serve` never
      # exposes the unauth runtime on the LAN); Docker overrides it here, on
      # the private compose network only.
      DOCIE_SERVING_BIND_HOST: ${DOCIE_SERVING_BIND_HOST:-0.0.0.0}
      DOCIE_SERVING_RECONCILE_INTERVAL: ${DOCIE_SERVING_RECONCILE_INTERVAL:-10}
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./runs:/app/runs
      - ./annotations:/app/annotations
      - ocr-cache:/app/.cache/ocr
      - serving-state:/app/.serving
      - artifact-store:/app/artifacts
      # Host Ollama models (read-only) so seed-from-ollama can pull existing GGUF
      # blobs into the store without re-downloading. Set OLLAMA_MODELS_HOST in
      # .env to your host path (e.g. C:/Users/<you>/.ollama/models).
      - ${OLLAMA_MODELS_HOST:-/root/.ollama/models}:/root/.ollama/models:ro
      # Encoder (HF) weights cache: the first GLiNER deploy downloads ~1GB;
      # persist it so container rebuilds/restarts don't re-download.
      - hf-cache:/root/.cache/huggingface
    command: ["docie-worker"]

  # The Connect worker: extraction / benchmark / GC functions only (PR-1 split
  # — runtime lifecycle moved to the single-replica `serving` service above).
  # Replica-safe by construction: benchmark artifacts land in the shared
  # `artifact-store` volume + Postgres index, extraction calls the deployed
  # runtimes over HTTP (`serving:<port>`) and writes only per-deployment
  # recency sidecars (last-write-wins by design), never deployments.json.
  # Scale freely: `docker compose up -d --scale worker=3`.
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/docie
      # Registers ONLY extraction/benchmark/GC — no lifecycle functions, no
      # reconciler, never spawns a runtime process.
      DOCIE_WORKER_ROLE: worker
      # Pinned for the same reason as on `api`: one shared serving home.
      DOCIE_SERVING_HOME: /app/.serving
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./runs:/app/runs
      - ./annotations:/app/annotations
      - ocr-cache:/app/.cache/ocr
      - serving-state:/app/.serving
      - artifact-store:/app/artifacts
    command: ["docie-worker"]

  # DocIE Studio web UI (Next.js). NEXT_PUBLIC_* are baked at build time and are
  # the URLs the BROWSER uses, so they default to localhost:<published port>.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3001}
        # Host port of the Inngest dashboard (matches INNGEST_HOST_PORT).
        # Must match INNGEST_HOST_PORT above (default 8288) or the Observability
        # dashboard link 404s.
        NEXT_PUBLIC_INNGEST_URL: ${NEXT_PUBLIC_INNGEST_URL:-http://localhost:8288}
        # BROWSER-reachable Inngest API for realtime live progress (the
        # @inngest/realtime hook reads this exact name; unset => Inngest Cloud =>
        # the self-hosted token is refused and the UI falls back to polling).
        # Must be the host-published Inngest API port (INNGEST_HOST_PORT).
        NEXT_PUBLIC_INNGEST_BASE_URL: ${NEXT_PUBLIC_INNGEST_BASE_URL:-http://localhost:${INNGEST_HOST_PORT:-8288}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  bench:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://docie:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}@postgres:5432/docie
    profiles: ["tools"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./runs:/app/runs
      - ocr-cache:/app/.cache/ocr
    entrypoint: ["docie-bench"]

  # Local CPU GGUF server. Bring your own model at ./models/model.gguf or set MODEL_PATH.
  # This uses llama-cpp-python's OpenAI-compatible server, not an external SaaS endpoint.
  llm-llamacpp:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.llamacpp
    profiles: ["local-llm"]
    environment:
      MODEL: ${MODEL_PATH:-/models/model.gguf}
      HOST: ${LLAMA_CPP_HOST:-0.0.0.0}
      PORT: ${LLAMA_CPP_PORT:-8000}
      N_CTX: ${LLAMA_CPP_N_CTX:-4096}
      N_THREADS: ${LLAMA_CPP_N_THREADS:-12}
      N_BATCH: ${LLAMA_CPP_N_BATCH:-256}
    volumes:
      - ./models:/models:ro
    ports:
      # Bound to loopback only (127.0.0.1): llama-cpp-python's OpenAI-compatible
      # server has no auth of its own -- same risk class as prometheus above, and
      # arguably worse (it accepts arbitrary requests and can leak prompts/
      # completions, not just metrics). Opt-in (`--profile local-llm`), but not
      # started-by-default doesn't mean safe-to-expose-by-default. Containers
      # reach it as `llm-llamacpp:8000` over the compose network regardless.
      - "127.0.0.1:${LLAMA_CPP_PORT:-8000}:8000"
    command:
      - "python"
      - "-m"
      - "llama_cpp.server"
      - "--model"
      - "${MODEL_PATH:-/models/model.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--n_ctx"
      - "${LLAMA_CPP_N_CTX:-4096}"
      - "--n_threads"
      - "${LLAMA_CPP_N_THREADS:-12}"
      - "--n_batch"
      - "${LLAMA_CPP_N_BATCH:-256}"

  # Sandboxed Python execution backing the code_interpreter MCP tool (#264).
  # Opt-in (`--profile sandbox`) — NOT started by a plain `docker compose up`.
  # Both judge0 services need `privileged: true`: that's a hard requirement
  # of `isolate` (the namespaces+cgroups sandbox judge0 runs internally, the
  # same primitive Piston uses too — verified against judge0's own compose
  # recipe, not assumed), not a Judge0 choice. See docs/adr-agent-sandboxing.md
  # for why this was picked over hand-rolling a sandbox, and for the hardening
  # applied below (auth required, callbacks off) on top of judge0's own
  # (looser) defaults. Dedicated db/redis — never shared with the app's own —
  # so a judge0 upgrade/migration can never touch docie's schema.
  #
  # JUDGE0_AUTH_TOKEN / JUDGE0_POSTGRES_PASSWORD / JUDGE0_REDIS_PASSWORD
  # default to EMPTY (`:-`), not `:?required` — these services never start
  # unless you pass `--profile sandbox`, and a hard-required var is checked
  # at compose-file PARSE time regardless of which profile you're actually
  # starting, which would otherwise break the entire default stack (api/
  # worker/serving/postgres/...) for every existing deployment the moment
  # this block landed. Set all three in `.env` before your first
  # `--profile sandbox up` — an empty AUTHN_TOKEN means judge0 runs with
  # auth OFF, and the code_interpreter MCP tool refuses to start against an
  # unauthenticated Judge0 rather than silently using one (see
  # mcp_servers/code_interpreter.py).
  judge0-server:
    # Pinned to `latest`, matching judge0's OWN docker-compose.yml even at
    # its v1.13.1 release tag — its releases don't publish a corresponding
    # versioned image tag to pin to instead.
    image: judge0/judge0:latest
    profiles: ["sandbox"]
    privileged: true
    # Some deployment platforms (confirmed on Coolify, via a live
    # deployment) inject their own project-wide "Environment Variables" over
    # this file's own per-service `environment:` block, but ONLY for key
    # NAMES that also appear in that project-wide list -- confirmed via a
    # clean negative control: POSTGRES_HOST/POSTGRES_DB/POSTGRES_USER (never
    # entered as project vars, judge0-internal-only names) correctly kept
    # this file's values, while DATABASE_URL and POSTGRES_PORT (both real
    # docie project vars, coincidentally also read by judge0's own Rails
    # app) got silently overridden with docie's OWN values instead of
    # judge0's. Judge0 is a Rails app: ActiveRecord auto-detects
    # DATABASE_URL over database.yml whenever it's present at all, and a
    # leaked docie POSTGRES_PORT (docie's own postgres's HOST-published
    # port, meaningless for container-to-container traffic) points judge0
    # at a port judge0-db was never listening on -- both crash-looped/
    # connection-refused for this exact reason.
    #
    # A compose-level `environment:` override can't be trusted to win on
    # every platform, so both are forced INSIDE the container's own shell
    # instead, after whatever got injected -- nothing outside the container
    # can override that. Wraps (doesn't replace) judge0's real entrypoint,
    # `/api/docker-entrypoint.sh` (confirmed via `docker inspect
    # judge0/judge0:latest`, matching judge0's own Dockerfile:
    # https://github.com/judge0/judge0/blob/master/Dockerfile). 5432 is
    # judge0-db's fixed container-internal Postgres port (the official
    # postgres image always listens there; the HOST-published mapping is a
    # separate, irrelevant number).
    #
    # Overriding `entrypoint:` clears the image's own default CMD (Compose
    # spec: "Compose implementations MUST clear out any default command on
    # the Docker image ... when entrypoint is configured") -- so `command:`
    # has to restate it explicitly, or "$@" below expands to nothing and
    # the entrypoint script gets called with no command at all.
    entrypoint: ["/bin/sh", "-c", "unset DATABASE_URL; export POSTGRES_PORT=5432; exec /api/docker-entrypoint.sh \"$@\"", "--"]
    command: ["/api/scripts/server"]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-}
      # Off by default upstream — an unauthenticated code-execution service
      # reachable by any other container on the compose network is a lateral-
      # movement risk even with no host port published.
      AUTHN_HEADER: X-Auth-Token
      AUTHN_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      # Result callbacks are exactly the feature the disclosed judge0 SSRF
      # advisory (GHSA-q7vg-26pg-v5hr) exploited; the MCP tool reads the
      # synchronous response, never needs a callback.
      ENABLE_CALLBACKS: "false"
      # judge0's own default; lets the v1 MCP tool do one synchronous
      # request instead of a submit-then-poll loop. judge0's docs note this
      # doesn't scale for a public multi-tenant judge — irrelevant here, one
      # operator's agent tool calls at a time.
      ENABLE_WAIT_RESULT: "true"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped
    # No published host port — reachable only as judge0-server:2358 over the
    # compose network, same posture as the `serving` runtime.

  judge0-worker:
    image: judge0/judge0:latest
    profiles: ["sandbox"]
    privileged: true
    # See judge0-server's entrypoint comment above -- same leak, same fix.
    # "$@" here picks up the `command:` below (./scripts/workers), not
    # judge0-server's default (/api/scripts/server).
    entrypoint: ["/bin/sh", "-c", "unset DATABASE_URL; export POSTGRES_PORT=5432; exec /api/docker-entrypoint.sh \"$@\"", "--"]
    command: ["./scripts/workers"]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-}
      ENABLE_CALLBACKS: "false"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    restart: unless-stopped

  judge0-db:
    image: postgres:16-alpine
    profiles: ["sandbox"]
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-}
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge0-redis:
    image: redis:7-alpine
    profiles: ["sandbox"]
    # --requirepass: same lateral-movement reasoning as judge0-server's
    # AUTHN_TOKEN — an unauthenticated queue reachable by any other
    # container on the compose network is a real risk, not a formality.
    command:
      [
        "redis-server", "--appendonly", "no",
        "--requirepass", "${JUDGE0_REDIS_PASSWORD:-}",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${JUDGE0_REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      # No baked-in default password: POSTGRES_PASSWORD is REQUIRED in .env
      # (see .env.example) — `docker compose up` now refuses to start
      # postgres/inngest with a clear error instead of silently accepting
      # the old "docie" default. Keep DATABASE_URL in .env in sync with
      # whatever you set here. (Only the password is parameterized — the
      # "docie" username is also hardcoded in the healthcheck below and in
      # DATABASE_URL, so it isn't worth making independently overridable.)
      POSTGRES_USER: docie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example) before starting the stack}
      POSTGRES_DB: docie
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Bound to loopback only (127.0.0.1): still reachable from the host
      # machine for `psql`/migrations/debugging, but not from the LAN or
      # internet — containers reach it as `postgres:5432` over the compose
      # network regardless of this binding. Override if you already run
      # Postgres on 5432: set POSTGRES_PORT=5433. If you have a real need for
      # Postgres to be reachable from other hosts, change the host binding
      # below explicitly and make sure POSTGRES_PASSWORD is strong first.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `/docker-entrypoint-initdb.d` only runs while initializing an empty
      # data directory. A restored/pre-existing volume (or a deployment host
      # that cannot retain the repo-relative init.sql bind mount) can therefore
      # have the main `docie` database but not Inngest's dedicated database.
      # Repair that state before declaring Postgres healthy so `inngest` never
      # starts against a database that does not exist. The check is idempotent:
      # `createdb` only runs when the catalog lookup finds no `inngest` DB.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U docie -d docie &&
          (psql -U docie -d postgres -tAc
          "SELECT 1 FROM pg_database WHERE datname = 'inngest'" | grep -qx 1 ||
          createdb -U docie inngest)
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      # Bound to loopback only (127.0.0.1): Prometheus ships with no auth of
      # its own, so publishing it to 0.0.0.0 hands out raw metrics + its
      # query API to anyone on the network. Grafana reaches it via the
      # compose network (http://prometheus:9090, see
      # infra/grafana/provisioning/datasources/datasource.yml), NOT through
      # this host-published port, so this binding doesn't affect the
      # Grafana dashboard. `curl localhost:9090` still works on the host.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # The Studio embeds the docie dashboard in an iframe (Observability tab).
      # Grafana refuses to be framed (X-Frame-Options: deny) and requires login
      # by default — both block the panel outright, showing a blank iframe.
      # Anonymous Viewer access + explicit embedding removes both blockers
      # without weakening admin auth (still required to edit/configure).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Host 3001 to leave 3000 for the DocIE Studio web UI. Bound to
      # loopback only (127.0.0.1): anonymous Viewer access is intentional
      # (see GF_AUTH_ANONYMOUS_ENABLED above, needed for the Studio iframe
      # embed) but that means anyone who can reach this port gets Grafana
      # with no login — loopback keeps that reachable set to the host
      # machine only, same as before for a purely local `docker compose up`.
      # If Studio and Grafana run on different hosts, or the browser loading
      # the Studio UI isn't on this machine, the iframe needs Grafana
      # reachable from elsewhere — don't just flip this to 0.0.0.0; put a
      # reverse proxy / network ACL in front of it instead, since anonymous
      # access has no other gate.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:
  ocr-cache:
  redis-data:
  serving-state:
  artifact-store:
  hf-cache:
  judge0-db-data:
